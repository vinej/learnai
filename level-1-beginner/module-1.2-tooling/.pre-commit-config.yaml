# Pre-commit configuration.
#
# Install once per machine:   pip install pre-commit
# Activate in this repo:      pre-commit install
# Run on all files manually:  pre-commit run --all-files
#
# Now `git commit` automatically lints + formats your staged files.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        args: [--ignore-missing-imports]
        # Mypy is slow; you can scope it to a folder:
        # files: ^src/
