name: ML CI

on:
  pull_request:
  push:
    branches: [main]

# Same workflow runs lint + tests on every PR; build/deploy gated on main.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install ruff mypy
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy . || true   # warn; remove `|| true` once fully typed

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt pytest pytest-cov
      - run: pytest -q --cov=src --cov-report=xml --cov-fail-under=80

  ml-eval:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Run held-out eval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/run_eval.py \
            --golden-set evals/golden.jsonl \
            --threshold 0.85 \
            --report eval-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval-report.json

  build-image:
    runs-on: ubuntu-latest
    needs: ml-eval
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build-image
    if: github.ref == 'refs/heads/main'
    environment:
      name: staging
      url: https://staging.example.com
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to staging
        env:
          STAGING_TOKEN: ${{ secrets.STAGING_TOKEN }}
        run: |
          # Replace with your real deploy command:
          # kubectl set image deployment/api api=ghcr.io/${{ github.repository }}:${{ github.sha }}
          # OR fly deploy --image ghcr.io/${{ github.repository }}:${{ github.sha }}
          # OR ssh deploy@host 'systemctl restart my-service'
          echo "Deploying ${{ github.sha }} to staging"

  deploy-prod:
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'
    environment:
      name: production       # required reviewers in repo settings → manual approval
      url: https://api.example.com
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to prod
        run: echo "Deploying ${{ github.sha }} to prod"
