[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forecaster"
version = "0.1.0"
description = "Capstone — multi-method financial forecaster"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.12",
    "yfinance>=0.2.40",
    "fredapi>=0.5.2",
    "python-dotenv>=1.0",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "lightgbm>=4.5",
    "anthropic>=0.40",
    "openai>=1.50",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "mlflow>=2.16",
]

[project.optional-dependencies]
deep = ["torch>=2.4", "neuralforecast>=2.0", "darts>=0.31"]
foundation = ["chronos-forecasting>=1.4"]
viz = ["streamlit>=1.39", "matplotlib>=3.8", "quantstats>=0.0.62"]
dev = ["pytest>=8.3", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["."]
include = ["forecaster*"]
